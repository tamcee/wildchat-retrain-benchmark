name: CI — smoke test on tiny sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test on committed tiny sample
        run: |
          python run_all.py \
            --seeds 1 \
            --max-weeks 18 \
            --pool data/tiny_sample.parquet \
            --sample-dir /tmp/samples \
            --results-dir results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/

